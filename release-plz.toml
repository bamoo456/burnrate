# This fork does not publish to crates.io: the `burnrate` name belongs to
# upstream. release-plz still manages version bumps, CHANGELOG, and tags, which
# is what `release.yml` keys its native bundles off.
[workspace]
publish = false
release = true
allow_dirty = false

[[package]]
name = "burnrate"
changelog_update = true
publish = false
semver_check = false
# Tauri's build.rs (tauri-build) regenerates files under gen/ during the build,
# which `cargo publish --verify` rejects ("source directory was modified by
# build.rs"). Skip the publish-time verify build; buildability is already
# covered by ci.yml (cargo build --release) and the Nix package build.
publish_no_verify = true
